    "/devices/{deviceId}/capabilities": {
      "post": {
        "operationId": "post_devices_deviceId_capabilities",
        "summary": "Authenticated Alarka versioned device capability and OS permission report; no media capture",
        "tags": [
          "Devices"
        ],
        "security": [
          {
            "DeviceBearer": []
          }
        ],
        "x-required-scope": "SELF_ONLY",
        "parameters": [
          {
            "name": "deviceId",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/Uuid"
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Durably accepted; parent state can refresh only after ACK, not an Android execution or streaming guarantee",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CapabilityReportReceipt"
                }
              }
            }
          },
          "401": {
            "description": "Authentication failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "No child/device-specific grant",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Outdated report version or same-version inconsistent digest; never roll back newest state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Report exceeds bounded feature/payload limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid or unsupported request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Rate/tenant budget exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Backend temporarily unavailable; safely retry",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CapabilityReport"
              }
            }
          }
        },
        "description": "Design-only whole-project endpoint. Accept device-bound signed/PoP authenticated state after secure pairing. Enforce monotonic version per enrollment_generation, feature allowlist, bounded payload, timestamps and idempotent receipt. Sender cannot claim server receive time; do not trust self-reported legal release override. Current M1 API remains narrower; no runtime code shipped."
      }
    },
