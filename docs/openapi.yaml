  "components": {
    "securitySchemes": {
      "ParentBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OIDC JWT"
      },
      "DeviceBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Bound device credential"
      }
    },
    "schemas": {
      "Uuid": {
        "type": "string",
        "format": "uuid"
      },
      "id": {
        "type": "string",
        "format": "uuid"
      },
      "stamp": {
        "type": "string",
        "format": "date-time"
      },
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "request_id"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "Event": {
        "type": "object",
        "required": [
          "event_id",
          "observed_at",
          "latitude",
          "longitude",
          "accuracy_m"
        ],
        "properties": {
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "latitude": {
            "type": "number",
            "minimum": -90,
            "maximum": 90
          },
          "longitude": {
            "type": "number",
            "minimum": -180,
            "maximum": 180
          },
          "accuracy_m": {
            "type": "number",
            "minimum": 0
          },
          "speed_mps": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "source_device_id": {
            "type": "string",
            "format": "uuid"
          },
          "provider": {
            "type": "string"
          }
        }
      },
      "Batch": {
        "type": "object",
        "required": [
          "batch_id",
          "events"
        ],
        "properties": {
          "batch_id": {
            "type": "string",
            "format": "uuid"
          },
          "events": {
            "type": "array",
            "maxItems": 500,
            "items": {
              "$ref": "#/components/schemas/Event"
            }
          }
        }
      },
      "Receipt": {
        "type": "object",
        "required": [
          "batch_id",
          "accepted_count",
          "duplicate_count",
          "rejected_count",
          "processing"
        ],
        "properties": {
          "batch_id": {
            "type": "string",
            "format": "uuid"
          },
          "accepted_count": {
            "type": "integer"
          },
          "duplicate_count": {
            "type": "integer"
          },
          "rejected_count": {
            "type": "integer"
          },
          "processing": {
            "type": "string",
            "enum": [
              "QUEUED",
              "NONE"
            ]
          },
          "errors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Location": {
        "type": "object",
        "required": [
          "source_device_id",
          "observed_at",
          "latitude",
          "longitude",
          "accuracy_m",
          "freshness"
        ],
        "properties": {
          "source_device_id": {
            "type": "string",
            "format": "uuid"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "latitude": {
            "type": "number"
          },
          "longitude": {
            "type": "number"
          },
          "accuracy_m": {
            "type": "number"
          },
          "speed_mps": {
            "type": [
              "number",
              "null"
            ]
          },
          "freshness": {
            "type": "string",
            "enum": [
              "RECENT",
              "LAST_KNOWN",
              "STALE",
              "UNAVAILABLE",
              "UNKNOWN"
            ]
          },
          "reason_code": {
            "type": "string"
          }
        }
      },
      "Place": {
        "type": "object",
        "required": [
          "id",
          "title",
          "latitude",
          "longitude",
          "radius_m",
          "row_version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "latitude": {
            "type": "number",
            "minimum": -90,
            "maximum": 90
          },
          "longitude": {
            "type": "number",
            "minimum": -180,
            "maximum": 180
          },
          "radius_m": {
            "type": "integer",
            "minimum": 50,
            "maximum": 2000
          },
          "row_version": {
            "type": "integer",
            "minimum": 1
          },
          "category": {
            "type": "string"
          },
          "alerts_enabled": {
            "type": "boolean"
          }
        }
      },
      "Trip": {
        "type": "object",
        "required": [
          "id",
          "revision",
          "state",
          "first_observed_at",
          "source_device_id"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer"
          },
          "state": {
            "type": "string",
            "enum": [
              "PROVISIONAL",
              "CONFIRMED",
              "UPDATED",
              "INCOMPLETE"
            ]
          },
          "first_observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_observed_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "source_device_id": {
            "type": "string",
            "format": "uuid"
          },
          "distance_observed_m": {
            "type": [
              "number",
              "null"
            ]
          },
          "quality": {
            "type": "string"
          }
        }
      },
      "Segment": {
        "type": "object",
        "required": [
          "kind",
          "start_at",
          "end_at"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "OBSERVED",
              "APPROXIMATE",
              "GAP"
            ]
          },
          "start_at": {
            "type": "string",
            "format": "date-time"
          },
          "end_at": {
            "type": "string",
            "format": "date-time"
          },
          "points": {
            "type": "array",
            "items": {
              "type": "array",
              "prefixItems": [
                {
                  "type": "number"
                },
                {
                  "type": "number"
                }
              ],
              "minItems": 2,
              "maxItems": 2
            }
          },
          "reason_code": {
            "type": "string"
          }
        }
      },
      "Stop": {
        "type": "object",
        "required": [
          "id",
          "status",
          "arrived_from",
          "arrived_until"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "CANDIDATE",
              "CONFIRMED",
              "AMBIGUOUS",
              "REJECTED"
            ]
          },
          "arrived_from": {
            "type": "string",
            "format": "date-time"
          },
          "arrived_until": {
            "type": "string",
            "format": "date-time"
          },
          "departed_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "named_place_id": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "accuracy_m": {
            "type": [
              "number",
              "null"
            ]
          }
        }
      },
      "Command": {
        "type": "object",
        "required": [
          "id",
          "type",
          "status",
          "expires_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "type": {
            "type": "string"
          },
          "status": {
            "$ref": "#/components/schemas/CommandStatus"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "reason_code": {
            "type": [
              "string",
              "null"
            ]
          },
          "completed_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "Grant": {
        "type": "object",
        "required": [
          "id",
          "child_id",
          "scopes",
          "expires_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "child_id": {
            "type": "string",
            "format": "uuid"
          },
          "scopes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "VIEW_CURRENT_LOCATION",
                "VIEW_HISTORY",
                "MANAGE_PLACES",
                "VIEW_USAGE",
                "MANAGE_POLICY",
                "RECEIVE_SOS"
              ]
            }
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "revoked_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "Status": {
        "type": "object",
        "properties": {
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "battery_pct": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 100
          },
          "charging": {
            "type": "boolean"
          },
          "permission_state": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "last_valid_fix_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "last_heartbeat_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "reason_code": {
            "type": "string"
          }
        }
      },
      "CommandStatus": {
        "type": "string",
        "enum": [
          "CREATED",
          "QUEUED",
          "DELIVERED",
          "ACCEPTED",
          "COMPLETED",
          "FAILED",
          "EXPIRED",
          "UNSUPPORTED",
          "PERMISSION_REQUIRED",
          "OS_REJECTED",
          "USER_ACTION_REQUIRED",
          "DEVICE_OFFLINE",
          "CANCELLED"
        ]
      }
    }
  }
